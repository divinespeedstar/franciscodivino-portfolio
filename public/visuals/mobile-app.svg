  <rect x="82" y="72" width="676" height="396" rx="38" fill="#0c0c0c" opacity=".72" stroke="#d7e2ea" stroke-opacity=".2"/>
  <rect x="118" y="108" width="176" height="320" rx="34" fill="#111820" stroke="#00d4ff" stroke-opacity=".5"/>
