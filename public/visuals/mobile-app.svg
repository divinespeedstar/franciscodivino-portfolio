      <stop offset="0" stop-color="#081827"/>
      <stop offset=".5" stop-color="#10264e"/>
      <stop offset="1" stop-color="#4b0e58"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
