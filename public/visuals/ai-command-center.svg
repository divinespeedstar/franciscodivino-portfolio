<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-labelledby="title desc">
  <title id="title">AI command center dashboard</title>
  <desc id="desc">Dark interface with AI marketing controls, charts, and campaign cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101018"/>
      <stop offset="0.48" stop-color="#28114a"/>
      <stop offset="1" stop-color="#092f3c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccff00"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="840" height="540" rx="38" fill="url(#bg)"/>
  <circle cx="670" cy="100" r="120" fill="#b600a8" opacity=".28" filter="url(#glow)"/>
  <circle cx="148" cy="450" r="150" fill="#00d4ff" opacity=".18" filter="url(#glow)"/>
  <rect x="58" y="56" width="724" height="428" rx="34" fill="#0c0c0c" opacity=".72" stroke="#d7e2ea" stroke-opacity=".22"/>
  <rect x="92" y="90" width="230" height="360" rx="24" fill="#ffffff" opacity=".07"/>
  <rect x="352" y="90" width="388" height="170" rx="24" fill="#ffffff" opacity=".08"/>
  <rect x="352" y="288" width="180" height="162" rx="24" fill="#ffffff" opacity=".08"/>
  <rect x="560" y="288" width="180" height="162" rx="24" fill="#ffffff" opacity=".08"/>
  <text x="112" y="142" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="28" font-weight="800">AI GROWTH</text>
  <text x="112" y="178" fill="#d7e2ea" opacity=".62" font-family="Arial, sans-serif" font-size="18">Francisco D.</text>
  <rect x="112" y="222" width="170" height="16" rx="8" fill="url(#neon)"/>
  <rect x="112" y="262" width="130" height="16" rx="8" fill="#d7e2ea" opacity=".45"/>
  <rect x="112" y="302" width="190" height="16" rx="8" fill="#d7e2ea" opacity=".32"/>
  <text x="382" y="145" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="22" font-weight="700">Marketing cockpit</text>
  <text x="382" y="198" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="900">+287%</text>
  <text x="590" y="198" fill="#ccff00" font-family="Arial, sans-serif" font-size="28" font-weight="800">IA ativa</text>
  <path d="M388 235 C448 190 484 245 540 205 S640 168 706 214" fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round"/>
  <text x="386" y="346" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="20" font-weight="700">Leads</text>
  <text x="386" y="400" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="900">1.8k</text>
  <text x="594" y="346" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="20" font-weight="700">Vendas</text>
  <text x="594" y="400" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="900">6.4x</text>
</svg>
