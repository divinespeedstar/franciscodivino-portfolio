<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-labelledby="title desc">
  <title id="title">CRM AI dashboard</title>
  <desc id="desc">AI CRM pipeline dashboard with sales stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0c"/>
      <stop offset=".5" stop-color="#11233b"/>
      <stop offset="1" stop-color="#30163f"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64ffda"/>
      <stop offset=".5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#9d6bff"/>
    </linearGradient>
  </defs>
  <rect width="840" height="540" rx="38" fill="url(#bg)"/>
  <rect x="66" y="62" width="708" height="416" rx="34" fill="#0c0c0c" opacity=".76" stroke="#d7e2ea" stroke-opacity=".2"/>
  <text x="108" y="136" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="34" font-weight="900">CRM com inteligencia</text>
  <text x="108" y="178" fill="#d7e2ea" opacity=".64" font-family="Arial, sans-serif" font-size="20">prioridade automatica para oportunidades reais</text>
  <rect x="110" y="238" width="150" height="170" rx="24" fill="#ffffff" opacity=".09"/>
  <rect x="288" y="238" width="150" height="170" rx="24" fill="#ffffff" opacity=".09"/>
  <rect x="466" y="238" width="150" height="170" rx="24" fill="#ffffff" opacity=".09"/>
  <rect x="644" y="238" width="80" height="170" rx="24" fill="#ffffff" opacity=".09"/>
  <rect x="132" y="278" width="104" height="20" rx="10" fill="url(#ai)"/>
  <rect x="310" y="278" width="104" height="20" rx="10" fill="url(#ai)"/>
  <rect x="488" y="278" width="104" height="20" rx="10" fill="url(#ai)"/>
  <text x="132" y="356" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="900">novo</text>
  <text x="310" y="356" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="900">quente</text>
  <text x="488" y="356" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="900">fechar</text>
