  <circle cx="236" cy="318" r="58" fill="#0c0c0c" opacity=".2"/>
  <rect x="410" y="242" width="260" height="30" rx="15" fill="#d7e2ea" opacity=".25"/>
  <rect x="410" y="300" width="210" height="30" rx="15" fill="#d7e2ea" opacity=".25"/>
  <rect x="410" y="358" width="290" height="30" rx="15" fill="#25d366" opacity=".72"/>
  <text x="112" y="440" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="900">cardapio + chatbot + trafego</text>
