  </defs>
  <rect width="840" height="540" rx="38" fill="url(#bg)"/>
  <rect x="70" y="68" width="700" height="404" rx="34" fill="#0c0c0c" opacity=".72" stroke="#ffffff" stroke-opacity=".18"/>
