<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-labelledby="title desc">
  <title id="title">Restaurant growth dashboard</title>
  <desc id="desc">Restaurant and delivery growth dashboard for orders and loyalty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1108"/>
      <stop offset=".56" stop-color="#4a1a0f"/>
      <stop offset="1" stop-color="#143225"/>
    </linearGradient>
    <linearGradient id="food" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be4c00"/>
      <stop offset=".5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#25d366"/>
