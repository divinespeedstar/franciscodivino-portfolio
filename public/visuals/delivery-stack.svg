  <text x="580" y="315" fill="#ccff00" font-family="Arial, sans-serif" font-size="42" font-weight="900">24h</text>
  <text x="420" y="350" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="16" font-weight="700">pedidos</text>
  <text x="576" y="350" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="16" font-weight="700">bot ativo</text>
