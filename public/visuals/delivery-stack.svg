<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-labelledby="title desc">
  <title id="title">Delivery marketing stack</title>
  <desc id="desc">Restaurant delivery stack with menu, ads, and WhatsApp ordering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23050b"/>
      <stop offset=".45" stop-color="#44121f"/>
      <stop offset="1" stop-color="#0a2e31"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset=".5" stop-color="#ffe259"/>
      <stop offset="1" stop-color="#ccff00"/>
    </linearGradient>
  </defs>
  <rect width="840" height="540" rx="38" fill="url(#bg)"/>
  <rect x="68" y="64" width="704" height="412" rx="36" fill="#0c0c0c" opacity=".75" stroke="#d7e2ea" stroke-opacity=".2"/>
  <rect x="108" y="112" width="230" height="314" rx="32" fill="#ffffff" opacity=".1"/>
  <rect x="136" y="152" width="174" height="116" rx="26" fill="url(#hot)"/>
  <circle cx="222" cy="210" r="46" fill="#0c0c0c" opacity=".18"/>
  <rect x="136" y="300" width="170" height="18" rx="9" fill="#d7e2ea" opacity=".62"/>
  <rect x="136" y="338" width="122" height="18" rx="9" fill="#d7e2ea" opacity=".34"/>
  <text x="384" y="154" fill="#d7e2ea" font-family="Arial, sans-serif" font-size="34" font-weight="900">Restaurante conectado</text>
  <text x="386" y="204" fill="#d7e2ea" opacity=".68" font-family="Arial, sans-serif" font-size="20">cardapio + trafego + WhatsApp + fidelizacao</text>
  <rect x="390" y="260" width="136" height="120" rx="24" fill="#ffffff" opacity=".09"/>
  <rect x="548" y="260" width="136" height="120" rx="24" fill="#ffffff" opacity=".09"/>
